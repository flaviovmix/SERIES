<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garrafa de Leiden 3D — o primeiro aparelho que guardou carga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./_base-modelo-3d.css">
<style>
  /* a carga e o numero principal do HUD: barra em vez de contador seco */
  .barra{height:7px; border-radius:99px; background:var(--bg2); overflow:hidden; margin-top:4px}
  .barra i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s linear}
  .barra.cheia i{background:var(--ok)}
</style>
</head>
<body>

<header>
  <div>COMO REINVENTAR O COMPUTADOR DO ZERO <span class="dot">·</span> ETAPA 04 <span class="dot">·</span> GARRAFA DE LEIDEN</div>
  <div>1746</div>
</header>

<main>
  <div id="cena"></div>
  <div class="aviso" id="aviso">Este modelo precisa de WebGL e internet<br>(a biblioteca 3D vem de CDN).</div>

  <div class="hud">
    <div class="legenda" id="legenda">Um pote de vidro com <b>folha metálica dos dois lados</b>. Carregue e veja onde a carga fica.</div>
    <div class="linha-total">
      <span class="num mono" id="pct">0%</span>
      <span class="meta mono" id="estado">vazia</span>
    </div>
    <div class="barra" id="barra"><i id="barraFill"></i></div>
    <div class="botoes">
      <button class="btn-mini cheio" id="btnCarrega">carregar</button>
      <button class="btn-mini" id="btnDescarrega">encostar na bola</button>
      <button class="btn-mini" id="btnCorte">ver por dentro</button>
      <button class="btn-mini" id="btnZera">zerar</button>
    </div>
    <div class="seletor">
      <span>zoom</span>
      <input type="range" id="zoomSlider" min="0" max="100" step="1" value="50">
      <span class="digito" id="zoomDigito">50%</span>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { THREE, montaPalco } from './_base-modelo-3d.js';

const legenda = document.getElementById('legenda');
const elPct = document.getElementById('pct');
const elEstado = document.getElementById('estado');
const barra = document.getElementById('barra');
const barraFill = document.getElementById('barraFill');
const btnCarrega = document.getElementById('btnCarrega');
const btnDescarrega = document.getElementById('btnDescarrega');
const btnCorte = document.getElementById('btnCorte');
const btnZera = document.getElementById('btnZera');
const zoomSlider = document.getElementById('zoomSlider');
const zoomDigito = document.getElementById('zoomDigito');

const palco = montaPalco({
  // a garrafa e alta e estreita: quem aperta e a altura, e o enquadramento da base
  // so olha a largura — dai a meia-largura folgada, pra sobrar tela acima do HUD
  alvo: [0, 2.1, 0],
  camPos: [0, 3.9, 12],
  meiaLarguraDesktop: 6.2,
  meiaLarguraMobile: 3.9,
  distMin: 7,           // baixo: o embutido na tela 0 vive floor-bound, sobra zoom no talo
  orbitaMin: 4.5,        // ate onde o slider (e a rolagem) deixam aproximar
  distMaxFixo: 15,       // teto fixo do slider: sem isso ele reabre a cada resize
});
const { scene, camera, renderer, controls, materiais, bloco, criaRotulo, redimensiona, inicia, aoClicar } = palco;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- zoom manual ----------
// A distancia automatica (redimensiona) so garante que a garrafa caiba no palco.
// O slider deixa o Flavio aproximar mais do que o enquadramento sozinho arriscaria,
// e sincroniza com a rolagem do mouse (que continua funcionando do mesmo jeito).
const ZOOM_PERTO = 4.5, ZOOM_LONGE = 15;
function distDoSlider(pct) { return ZOOM_LONGE - (pct / 100) * (ZOOM_LONGE - ZOOM_PERTO); }
function pctDaDistancia(dist) {
  return Math.round(((ZOOM_LONGE - dist) / (ZOOM_LONGE - ZOOM_PERTO)) * 100);
}
function aplicaZoom(pct) {
  const dist = distDoSlider(pct);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
  controls.update();
}
function sincronizaSlider() {
  const pct = Math.max(0, Math.min(100, pctDaDistancia(camera.position.distanceTo(controls.target))));
  zoomSlider.value = pct;
  zoomDigito.textContent = pct + '%';
}
zoomSlider.addEventListener('input', () => {
  controls.autoRotate = false;
  aplicaZoom(Number(zoomSlider.value));
  zoomDigito.textContent = zoomSlider.value + '%';
});
controls.addEventListener('change', sincronizaSlider);

// medidas em uma coluna so: mexer aqui move a garrafa inteira junto
const MESA = 0.3;                 // altura do tampo (o vidro nasce nele)
const VIDRO_H = 3.4, R_EXT = 1.2, PAREDE = 0.08;
const FOLHA_H = 2.2;              // a folha sobe so ate uns 2/3: o resto do vidro fica limpo
const FOLHA_Y = MESA + FOLHA_H / 2 + 0.09;   // base em 0.39: acima do fundo de vidro (topo 0.38)
const BOCA = MESA + VIDRO_H;      // onde entra a rolha
const BOLA_Y = BOCA + 1.05;       // o prego que se encosta pra levar o choque
const R_FOLHA_INT = R_EXT - PAREDE - 0.015;

// ---------- bancada ----------
const mesa = bloco(5.4, MESA, 3.2, materiais.madeira, 0.08);
mesa.position.y = MESA / 2;
scene.add(mesa);

// ---------- o corte ----------
// Em vez de trocar geometria (recompila o material), o plano fica sempre ligado e
// sai de cena indo pra longe: constant 0 corta a metade de perto, 40 nao corta nada.
// Com o corte ligado, o plano SEGUE a camera (ver tick): a orbita continua girando
// e o interior fica sempre de frente — sem isso o autoRotate virava o corte de costas.
renderer.localClippingEnabled = true;
const planoCorte = new THREE.Plane(new THREE.Vector3(0, 0, -1), 40);
function cortaComigo(mat) {
  mat.clippingPlanes = [planoCorte];
  mat.clipShadows = true;   // senao a metade removida continua projetando sombra
  return mat;
}

// ---------- vidro, folhas, rolha ----------
const matVidro = cortaComigo(new THREE.MeshPhysicalMaterial({
  color: 0xcfe0dc, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.26,
  side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1.1, clearcoat: 1,
}));
const matEstanho = cortaComigo(materiais.metal(0x9fa8ad, { roughness: 0.34, side: THREE.DoubleSide }));
const matEstanhoInt = cortaComigo(materiais.metal(0xb6bdc0, { roughness: 0.3, side: THREE.DoubleSide }));
// haste, bola, corrente e rolha NAO entram no corte: cortadas viram contorno solto
// e some justamente o caminho da carga, que e o que o corte deveria mostrar.
const matLatao = materiais.latao.clone();
const matRolha = new THREE.MeshStandardMaterial({ color: 0x8a6a3f, roughness: 0.85 });

const garrafa = new THREE.Group();
scene.add(garrafa);

const parede = new THREE.Mesh(new THREE.CylinderGeometry(R_EXT, R_EXT, VIDRO_H, 56, 1, true), matVidro);
parede.position.y = MESA + VIDRO_H / 2;
parede.renderOrder = 3;           // o vidro entra por ultimo pra nao apagar o que esta atras dele
garrafa.add(parede);

const paredeInt = new THREE.Mesh(new THREE.CylinderGeometry(R_EXT - PAREDE, R_EXT - PAREDE, VIDRO_H, 56, 1, true), matVidro);
paredeInt.position.y = parede.position.y;
paredeInt.renderOrder = 3;
garrafa.add(paredeInt);

const fundo = new THREE.Mesh(new THREE.CylinderGeometry(R_EXT, R_EXT, PAREDE, 56), matVidro);
fundo.position.y = MESA + PAREDE / 2;
fundo.renderOrder = 3;
garrafa.add(fundo);

// labio na boca e pe arredondado: sem eles o cilindro le como tubo, nao como pote
const labio = new THREE.Mesh(new THREE.TorusGeometry(R_EXT - 0.01, 0.06, 12, 56), matVidro);
labio.geometry.rotateX(Math.PI / 2);
labio.position.y = BOCA + 0.01;
labio.renderOrder = 3;
const pe = new THREE.Mesh(new THREE.TorusGeometry(R_EXT - 0.04, 0.05, 12, 56), matVidro);
pe.geometry.rotateX(Math.PI / 2);
pe.position.y = MESA + 0.05;
pe.renderOrder = 3;
garrafa.add(labio, pe);

const folhaFora = new THREE.Mesh(new THREE.CylinderGeometry(R_EXT + 0.015, R_EXT + 0.015, FOLHA_H, 56, 1, true), matEstanho);
folhaFora.position.y = FOLHA_Y;
folhaFora.castShadow = true;
garrafa.add(folhaFora);

const folhaDentro = new THREE.Mesh(new THREE.CylinderGeometry(R_FOLHA_INT, R_FOLHA_INT, FOLHA_H, 56, 1, true), matEstanhoInt);
folhaDentro.position.y = FOLHA_Y;
garrafa.add(folhaDentro);
// piso metalico onde a corrente encosta (raio um tico menor que a folha da parede,
// senao as duas superficies coincidem e brigam no z-buffer)
const folhaFundo = new THREE.Mesh(new THREE.CylinderGeometry(R_FOLHA_INT - 0.01, R_FOLHA_INT - 0.01, 0.04, 48), matEstanhoInt);
folhaFundo.position.y = MESA + PAREDE + 0.02;
garrafa.add(folhaFundo);

const rolha = new THREE.Mesh(new THREE.CylinderGeometry(R_EXT - 0.02, R_EXT - PAREDE - 0.02, 0.55, 40), matRolha);
rolha.position.y = BOCA - 0.05;
rolha.castShadow = true;
garrafa.add(rolha);
const rolhaDomo = new THREE.Mesh(new THREE.SphereGeometry(R_EXT - 0.02, 40, 12, 0, Math.PI * 2, 0, Math.PI / 2), matRolha);
rolhaDomo.scale.y = 0.22;
rolhaDomo.position.y = BOCA + 0.22;
garrafa.add(rolhaDomo);

const haste = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, BOLA_Y - (BOCA - 0.6), 20), matLatao);
haste.position.y = (BOLA_Y + BOCA - 0.6) / 2;
haste.castShadow = true;
garrafa.add(haste);

const bola = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 24), matLatao);
bola.position.y = BOLA_Y;
bola.castShadow = true;
garrafa.add(bola);

// ---------- corrente ----------
// Elos de verdade (torus alternado seguindo a curva), pendurada na haste e
// deitando no piso metalico: e ela que leva a carga pra folha de dentro.
const curvaCorrente = new THREE.CatmullRomCurve3([
  v3(0, BOCA - 0.58, 0),
  v3(0.18, 2.2, 0.06),
  v3(0.42, 1.1, 0.14),
  v3(0.6, 0.52, 0.2),
  v3(0.88, 0.45, 0.28),
]);
const GEO_ELO = new THREE.TorusGeometry(0.075, 0.024, 8, 18);
const EIXO_X = v3(1, 0, 0);
// o arco tem ~3.0 de comprimento e cada elo alcanca ~0.1 pra cada lado:
// menos que 17 elos deixa vao entre eles e a corrente vira aneis soltos
const N_ELOS = 17;
for (let i = 0; i < N_ELOS; i += 1) {
  const t = i / (N_ELOS - 1);
  const elo = new THREE.Mesh(GEO_ELO, matLatao);
  curvaCorrente.getPointAt(t, elo.position);
  // o plano do elo contem a direcao da corrente (X do elo vira a tangente);
  // elos alternados rolam 90 graus em volta dela, como corrente de verdade
  elo.quaternion.setFromUnitVectors(EIXO_X, curvaCorrente.getTangentAt(t));
  if (i % 2) elo.rotateX(Math.PI / 2);
  elo.castShadow = true;
  garrafa.add(elo);
}

// ---------- a maquina de atrito (so o condutor dela) ----------
// De onde a carga vem: uma bola de latao num pe isolante ao lado da garrafa.
// A faisca do "carregar" salta daqui pra bola da haste.
const matVidroLivre = new THREE.MeshPhysicalMaterial({
  color: 0xcfe0dc, roughness: 0.08, transparent: true, opacity: 0.32, clearcoat: 1, envMapIntensity: 1,
});
const maq = new THREE.Group();
const maqPe = bloco(0.55, 0.14, 0.55, materiais.madeiraEscura, 0.04);
maqPe.position.set(-1.95, MESA + 0.07, 0);
// altura fechada na conta: topo da coluna (0.44 + h) tem que encostar no fundo
// da esfera (BOLA_Y - 0.24), senao a bola fica pendurada no ar
const H_COLUNA = BOLA_Y - 0.24 - (MESA + 0.14);
const maqColuna = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, H_COLUNA, 16), matVidroLivre);
maqColuna.position.set(-1.95, MESA + 0.14 + H_COLUNA / 2, 0);
const esferaMaq = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 24), matLatao);
esferaMaq.position.set(-1.95, BOLA_Y, 0);
esferaMaq.castShadow = true;
maq.add(maqPe, maqColuna, esferaMaq);
scene.add(maq);

// ---------- a borda do corte ----------
// As cascas sao superficies sem espessura: cortadas, o sanduiche sumiria.
// Estas tiras ficam encostadas no plano (z<0, fora do clipping) e mostram
// as tres camadas de perfil: metal, vidro, metal.
const bordaCorte = new THREE.Group();
bordaCorte.visible = false;
garrafa.add(bordaCorte);
const matCorteVidro = new THREE.MeshStandardMaterial({
  color: 0xdfe9e4, roughness: 0.6, transparent: true, opacity: 0.55, depthWrite: false,
});
const matCorteFolha = materiais.metal(0xc4cdd2, { roughness: 0.3 });
[-1, 1].forEach((lado) => {
  const tiraVidro = new THREE.Mesh(new THREE.BoxGeometry(PAREDE, VIDRO_H, 0.028), matCorteVidro);
  tiraVidro.position.set(lado * (R_EXT - PAREDE / 2), MESA + VIDRO_H / 2, -0.016);
  const tiraDentro = new THREE.Mesh(new THREE.BoxGeometry(0.05, FOLHA_H, 0.03), matCorteFolha);
  tiraDentro.position.set(lado * R_FOLHA_INT, FOLHA_Y, -0.017);
  const tiraFora = new THREE.Mesh(new THREE.BoxGeometry(0.05, FOLHA_H, 0.03), matCorteFolha);
  tiraFora.position.set(lado * (R_EXT + 0.015), FOLHA_Y, -0.017);
  bordaCorte.add(tiraVidro, tiraDentro, tiraFora);
});

// ---------- os sinais de carga ----------
// Sprite de "+"/"-" desenhado no canvas: a carga tem que ser LIDA, nao deduzida da cor.
function sinal(positivo, cor) {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  const cx = cv.getContext('2d');
  // desenhado a mao, nao por fonte: o "menos" tipografico sai fino demais e some
  // ao lado do "mais", e o par tem que ter o mesmo peso pra leitura funcionar.
  cx.fillStyle = cor;
  cx.fillRect(12, 28, 40, 9);
  if (positivo) cx.fillRect(27.5, 12.5, 9, 40);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, opacity: 0, depthWrite: false,
  }));
  sp.renderOrder = 2;
  return sp;
}
const positivos = [], negativos = [];
const SINAIS = 22;
for (let i = 0; i < SINAIS; i += 1) {
  const ang = (i / SINAIS) * Math.PI * 6;                 // espiral: espalha sem alinhar em coluna
  const y = MESA + 0.35 + (i / SINAIS) * (FOLHA_H - 0.5);
  // colados na folha (nao no ar), e cortados junto com ela: sinal da metade
  // removida sumindo com a folha e o que sobra fica SO no lado certo do vidro
  const p = sinal(true, '#b0402c');
  cortaComigo(p.material);
  p.position.set(Math.cos(ang) * (R_FOLHA_INT - 0.1), y, Math.sin(ang) * (R_FOLHA_INT - 0.1));
  const n = sinal(false, '#2f5f9e');
  cortaComigo(n.material);
  n.position.set(Math.cos(ang) * (R_EXT + 0.08), y, Math.sin(ang) * (R_EXT + 0.08));
  garrafa.add(p, n);
  positivos.push(p); negativos.push(n);
}

// ---------- o fluxo de carga ----------
// Enquanto carrega, uns "+" pequenos escorrem bola -> haste -> corrente:
// o caminho da carga vira movimento, nao so legenda.
const caminhoFluxo = new THREE.CatmullRomCurve3([
  v3(0, BOLA_Y, 0), v3(0, BOCA + 0.2, 0),
  ...curvaCorrente.points,
]);
const FLUXO_N = 5;
const fluxo = [];
for (let i = 0; i < FLUXO_N; i += 1) {
  const s = sinal(true, '#b0402c');
  // raio-x de proposito: sem depthTest o + em transito aparece atraves da rolha
  // e da folha — senao ele pisca sumindo dentro da rolha no meio do caminho
  s.material.depthTest = false;
  s.renderOrder = 5;
  s.scale.setScalar(0.3);
  garrafa.add(s);
  fluxo.push(s);
}
let tFluxo = 0, faseFluxo = 0;

// ---------- faisca ----------
// Tubo, nao THREE.Line (no Windows linha e sempre 1px e some); nucleo branco
// + brilho azul, senao a faisca clara desaparece no fundo pergaminho.
const faiscaGrp = new THREE.Group();
scene.add(faiscaGrp);
const matFaiscaCore = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false });
const matFaiscaGlow = new THREE.MeshBasicMaterial({ color: 0x59b6ff, transparent: true, opacity: 0, depthWrite: false });
const flash = new THREE.PointLight(0xdcecff, 0, 14);
scene.add(flash);

function tubo(pts, raio, mat) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, raio, 6, false), mat);
  m.renderOrder = 4;
  return m;
}
// Recebe os PONTOS DE PASSAGEM do arco (2 pra faisca reta da maquina; 4 pra
// descarga, que contorna a rolha por fora — raio em linha reta furava a rolha
// e a parede de vidro, exatamente o que a cena ensina que nao acontece).
function desenhaFaisca(caminho, tremor = 0.3) {
  faiscaGrp.children.forEach((c) => c.geometry.dispose());
  faiscaGrp.clear();
  const pts = new THREE.CatmullRomCurve3(caminho).getPoints(10);
  pts.forEach((p, i) => {
    if (i > 0 && i < pts.length - 1) {
      p.x += (Math.random() - 0.5) * tremor;
      p.y += (Math.random() - 0.5) * tremor * 0.7;
      p.z += (Math.random() - 0.5) * tremor;
    }
  });
  faiscaGrp.add(tubo(pts, 0.09, matFaiscaGlow), tubo(pts, 0.035, matFaiscaCore));
  // um ramo curto saindo do meio, como raio de verdade
  const meio = pts[5].clone();
  const fim = meio.clone().add(v3((Math.random() - 0.5) * 0.8, -0.25 - Math.random() * 0.35, (Math.random() - 0.5) * 0.8));
  faiscaGrp.add(tubo([meio, meio.clone().lerp(fim, 0.5).add(v3(0.06, -0.05, 0.05)), fim], 0.02, matFaiscaCore));
  flash.position.copy(pts[5]);
}

// ---------- rotulos ----------
document.fonts.ready.then(() => {
  // tudo acima da metade da garrafa: o HUD come a faixa de baixo da tela
  // "corrente" e as folhas ficam a DIREITA, perto do que nomeiam — a esquerda
  // qualquer rotulo cola na coluna do condutor e parece nomear ela
  [
    ['haste de latão', 3.1, BOLA_Y + 0.1],
    ['vidro', 2.9, MESA + VIDRO_H - 0.45],
    ['corrente', 2.95, 2.6],
    ['folha de fora', 3.2, FOLHA_Y + 0.5],
    ['folha de dentro', 3.05, FOLHA_Y - 0.4],
    ['condutor da máquina', -2.0, BOLA_Y + 0.75],
  ].forEach(([txt, x, y]) => {
    const sp = criaRotulo(txt, 0.85);
    sp.position.set(x, y, 0);
    scene.add(sp);
  });
  redimensiona();
  // o enquadramento automatico so garante que a garrafa caiba (formula de largura);
  // embutido na tela 0, ele sobra distancia e a garrafa nasce pequena. 40% e o
  // ponto que o Flavio marcou como o tamanho certo pra abrir a pagina
  aplicaZoom(40);
  sincronizaSlider();
});

// ---------- mecanica ----------
let carga = 0;          // o que se ve
let alvoCarga = 0;      // pra onde ela esta indo (o botao empurra em degraus)
let tFaisca = 0;        // segundos restantes de faisca na tela
let cortado = false;

function atualizaHud() {
  const pct = Math.round(carga * 100);
  elPct.textContent = pct + '%';
  barraFill.style.width = pct + '%';
  barra.classList.toggle('cheia', carga > 0.99);
  elEstado.textContent = carga < 0.02 ? 'vazia' : carga > 0.99 ? 'no talo' : 'carregando';
  btnDescarrega.disabled = carga < 0.02;
}

function carrega() {
  if (alvoCarga > 0.99) {
    legenda.innerHTML = 'Cheia. Ela <b>segura</b> a carga: dá pra largar e voltar amanhã que o choque ainda está lá.';
    return;
  }
  alvoCarga = Math.min(1, alvoCarga + 0.25);
  desenhaFaisca([esferaMaq.position.clone().add(v3(0.22, 0.02, 0)), bola.position.clone().add(v3(-0.25, 0.02, 0))], 0.32);
  tFaisca = 0.18;
  tFluxo = 1.1;
  legenda.innerHTML = 'A faísca salta da máquina pra bola, e o <b>+</b> desce pela corrente até a folha de dentro. Ele atrai o <b>−</b>, que sobe da mesa pra folha de fora — a <b>atração</b> atravessa o vidro; a carga, não.'
    + (cortado ? '' : ' Aperte <b>ver por dentro</b> pra abrir o sanduíche.');
}

function descarrega() {
  if (carga < 0.02) return;
  // o arco contorna a rolha e desce COLADO no lado de fora do vidro ate a
  // folha — o caminho do flashover real, e o unico que nao fura o isolante
  desenhaFaisca([
    bola.position.clone(),
    v3(0.85, BOCA + 0.7, 0.5),
    v3(1.5, BOCA - 0.75, 0.42),
    v3(1.17, FOLHA_Y + FOLHA_H / 2 + 0.15, 0.28),
  ], 0.14);
  tFaisca = 0.5;
  tFluxo = 0;
  carga = 0; alvoCarga = 0;
  legenda.innerHTML = 'ESTALO. Uma mão na <b>folha de fora</b>, um dedo na <b>bola</b>: os dois lados se encontram e a carga <b>vai embora de uma vez</b>.';
  atualizaHud();
}

function alternaCorte(ligar) {
  cortado = ligar === undefined ? !cortado : ligar;
  planoCorte.constant = cortado ? 0 : 40;
  bordaCorte.visible = cortado;
  btnCorte.textContent = cortado ? 'fechar a garrafa' : 'ver por dentro';
  btnCorte.classList.toggle('cheio', cortado);
  legenda.innerHTML = cortado
    ? 'É um sanduíche: <b>metal, vidro, metal</b>. O vidro não deixa a carga passar de uma folha pra outra, e é isso que a segura.'
    : 'Por fora é só um pote. O aparelho inteiro é a folha de dentro, o vidro e a folha de fora.';
}

function zera() {
  carga = 0; alvoCarga = 0; tFaisca = 0; tFluxo = 0;
  legenda.innerHTML = 'Descarregada. Carregue de novo e olhe as duas folhas ao mesmo tempo.';
  atualizaHud();
}

btnCarrega.addEventListener('click', carrega);
btnDescarrega.addEventListener('click', descarrega);
btnCorte.addEventListener('click', () => alternaCorte());
btnZera.addEventListener('click', zera);
// clicar na bola da maquina carrega; na bola da garrafa, descarrega
aoClicar([bola, esferaMaq], (hit) => (hit.object === esferaMaq ? carrega() : descarrega()));

atualizaHud();
const dirCam = new THREE.Vector3();
inicia((dt) => {
  // corte segue a camera: a orbita pode girar a vontade que o interior
  // continua de frente (o plano e as tiras da borda acompanham o azimute)
  if (cortado) {
    camera.getWorldDirection(dirCam);
    dirCam.y = 0;
    dirCam.normalize();
    planoCorte.normal.copy(dirCam);
    bordaCorte.rotation.y = Math.atan2(-dirCam.x, -dirCam.z);
  }
  if (Math.abs(alvoCarga - carga) > 0.001) {
    carga += (alvoCarga - carga) * Math.min(1, dt * 5);
    // o lerp nunca chega no fim sozinho, e 99% no HUD parece bug: encosta e para
    if (Math.abs(alvoCarga - carga) < 0.008) carga = alvoCarga;
    atualizaHud();
  }
  const op = Math.min(1, carga * 1.3);
  const esc = 0.5 + carga * 0.16;
  // enchem um a um, de baixo pra cima: a carga chegando fica visível, nao so mais forte
  positivos.forEach((s, i) => {
    s.material.opacity = op * Math.min(1, Math.max(0, carga * SINAIS - i));
    s.scale.setScalar(esc);
  });
  negativos.forEach((s, i) => {
    s.material.opacity = op * Math.min(1, Math.max(0, carga * SINAIS - i));
    s.scale.setScalar(esc);
  });
  if (tFluxo > 0) {
    tFluxo -= dt;
    faseFluxo += dt * 0.5;
    fluxo.forEach((s, i) => {
      const t = (faseFluxo + i / FLUXO_N) % 1;
      caminhoFluxo.getPointAt(t, s.position);
      s.material.opacity = Math.min(1, tFluxo * 3) * 0.95;
    });
  } else if (fluxo[0].material.opacity > 0) {
    fluxo.forEach((s) => { s.material.opacity = 0; });
  }
  if (tFaisca > 0) {
    tFaisca -= dt;
    const f = Math.max(0, Math.min(1, tFaisca * 4));
    matFaiscaCore.opacity = f;
    matFaiscaGlow.opacity = f * 0.75;
    flash.intensity = f * 60;
  } else if (matFaiscaCore.opacity !== 0) {
    matFaiscaCore.opacity = 0; matFaiscaGlow.opacity = 0; flash.intensity = 0;
  }
});

// gancho de QA (Playwright): acoes + um estado legivel e o "parado" pra esperar a animacao
window.__garrafa = {
  carrega, descarrega, zera,
  corte: (v) => alternaCorte(v),
  estado: () => ({ carga: Number(carga.toFixed(3)), alvo: alvoCarga, cortado, faiscando: tFaisca > 0, fluindo: tFluxo > 0 }),
  // inclui o fluxo: sem ele, screenshot "parado" pega os + do fluxo em posicao aleatoria
  parado: () => Math.abs(alvoCarga - carga) < 0.01 && tFaisca <= 0 && tFluxo <= 0,
};
</script>
