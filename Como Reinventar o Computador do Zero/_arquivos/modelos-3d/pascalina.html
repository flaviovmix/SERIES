<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pascalina 3D — protótipo de estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./_base-modelo-3d.css">
</head>
<body>

<header>
  <div>SÉRIE EQUIPAMENTOS <span class="dot">·</span> LAB <span class="dot">·</span> PASCALINA</div>
  <div>PROTÓTIPO DE ESTILO</div>
</header>

<main>
  <div id="cena"></div>
  <div class="aviso" id="aviso">Este protótipo precisa de WebGL e internet<br>(a biblioteca 3D vem de CDN).</div>

  <div class="hud">
    <div class="legenda" id="legenda">Clique num <b>número</b> da roda pra somar. Só se soma girando — é a Pascalina.</div>
    <div class="linha-total">
      <span class="num mono" id="valor">000</span>
      <span class="meta mono" id="meta"></span>
    </div>
    <div class="botoes">
      <button class="btn-mini cheio" id="btn91">ver o 9 + 1</button>
      <button class="btn-mini cheio" id="btn991">ver o 99 + 1</button>
      <button class="btn-mini" id="btnDesafio">desafio: 28 + 35</button>
      <button class="btn-mini" id="btnZerar">zerar</button>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { THREE, montaPalco } from './_base-modelo-3d.js';

const legenda = document.getElementById('legenda');
const elValor = document.getElementById('valor');
const elMeta = document.getElementById('meta');

const palco = montaPalco({
  alvo: [0, 1.3, 0],
  camPos: [0, 6.2, 9.5],
  meiaLarguraDesktop: 5.0,
  meiaLarguraMobile: 4.2,
  distMin: 9.0,
  orbitaMin: 5,
  maxPolar: 1.35,
});
const { scene, camera, renderer, controls, materiais, bloco, criaRotulo, redimensiona, inicia, aoClicar } = palco;
const bronzeFosco = materiais.metal(0xa87d3c);

// ---------- caixa ----------
const maquina = new THREE.Group();
scene.add(maquina);

const caixa = bloco(7.2, 1.5, 3.6, materiais.madeira, 0.1);
caixa.position.y = 0.95;
maquina.add(caixa);
[-1, 1].forEach((lx) => [-1, 1].forEach((lz) => {
  const pe = bloco(0.5, 0.25, 0.5, materiais.madeiraEscura, 0.06);
  pe.position.set(lx * 3.2, 0.12, lz * 1.4);
  maquina.add(pe);
}));
const tampa = bloco(7.0, 0.1, 3.4, bronzeFosco, 0.03);
tampa.position.y = 1.74;
maquina.add(tampa);

// ---------- colunas ----------
// 3 eixos: [0]=unidade (direita), [1]=dezena, [2]=centena (esquerda)
const COL_X = [2.2, 0, -2.2];
const NOMES = ['UNIDADE', 'DEZENA', 'CENTENA'];
const estado = [0, 0, 0];
const rodas = [];      // grupo giratorio dos pinos
const tambores = [];   // cilindros dos visores
const alavancas = [];  // sautoir simplificado de cada vai-um
const clicaveis = [];  // esferas invisiveis sobre os numeros fixos

// ---------- visores (tambores tipo odometro) ----------
// moldura de latao no fundo da tampa com 3 janelas; digito da vez de frente pro observador
const VISOR_Z = -1.05, VISOR_Y = 2.15, TAMBOR_RAIO = 0.42;
const barraCima = bloco(5.6, 0.18, 0.7, materiais.latao, 0.05);  barraCima.position.set(0, VISOR_Y + 0.42, VISOR_Z);
const barraBaixo = bloco(5.6, 0.18, 0.7, materiais.latao, 0.05); barraBaixo.position.set(0, VISOR_Y - 0.42, VISOR_Z);
maquina.add(barraCima, barraBaixo);
// divisorias dimensionadas pra deixar 3 janelas de 0.62 centradas nas colunas
[[-3.0, 0.99], [-1.1, 1.58], [1.1, 1.58], [3.0, 0.99]].forEach(([x, w]) => {
  const coluna = bloco(w, 1.02, 0.7, materiais.latao, 0.05);
  coluna.position.set(x, VISOR_Y, VISOR_Z);
  maquina.add(coluna);
});

function texturaTambor() {
  const cv = document.createElement('canvas');
  cv.width = 1280; cv.height = 128;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#f7efdd';
  cx.fillRect(0, 0, 1280, 128);
  cx.fillStyle = '#2b2016';
  cx.font = '600 84px "IBM Plex Mono", monospace';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let n = 0; n <= 10; n++) {          // 0 desenhado nas duas bordas (emenda do cilindro)
    cx.save();
    cx.translate((n % 10 === n ? n : 10) * 128, 64);
    cx.rotate(Math.PI / 2);                // digito em pe na superficie do tambor deitado
    cx.fillText(n % 10, 0, 0);
    cx.restore();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.wrapS = THREE.RepeatWrapping;
  tx.anisotropy = 4;
  return tx;
}

COL_X.forEach((x, col) => {
  const geo = new THREE.CylinderGeometry(TAMBOR_RAIO, TAMBOR_RAIO, 0.6, 48, 1, true);
  geo.rotateZ(Math.PI / 2);                // eixo do tambor deitado em x
  const tb = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: texturaTambor(), roughness: 0.55 }));
  tb.position.set(x, VISOR_Y, VISOR_Z);
  maquina.add(tb);
  tambores.push(tb);

  // alavanca do sautoir (decorativa, cai no vai-um) entre esta coluna e a proxima
  if (col < 2) {
    const alav = new THREE.Group();
    alav.position.set(x - 1.1, VISOR_Y + 0.55, VISOR_Z);
    const braco = bloco(0.5, 0.08, 0.1, bronzeFosco);
    braco.position.x = -0.2;
    const peso = bloco(0.14, 0.18, 0.14, materiais.latao);
    peso.position.x = -0.45;
    alav.add(braco, peso);
    maquina.add(alav);
    alavancas.push({ grupo: alav, t: -1 });
  }
});

// ---------- rodas de entrada (anel fixo com numeros + pinos que giram) ----------
const RODA_Y = 1.80, RODA_Z = 0.55, ANEL_R = 256;   // ANEL_R = raio do canvas em px
function texturaAnel() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#b98f4e';
  cx.beginPath(); cx.arc(256, 256, 250, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#8a6528';
  cx.beginPath(); cx.arc(256, 256, 156, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#2b2016';
  cx.font = '600 52px "IBM Plex Mono", monospace';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (let d = 0; d < 10; d++) {
    const a = -Math.PI / 2 + d * Math.PI * 2 / 10;   // 0 no fundo (12h), crescendo em sentido horario
    cx.save();
    cx.translate(256 + Math.cos(a) * 200, 256 + Math.sin(a) * 200);
    cx.rotate(a + Math.PI / 2);                       // numero radial, pe pro centro (estilo relogio)
    cx.fillText(d, 0, 0);
    cx.restore();
  }
  const tx = new THREE.CanvasTexture(cv);
  tx.anisotropy = 8;
  return tx;
}

const RAIO_ANEL_MUNDO = 1.05;                        // 512px => 2.1 de lado
COL_X.forEach((x, col) => {
  const anel = new THREE.Mesh(
    new THREE.CircleGeometry(RAIO_ANEL_MUNDO, 48),
    new THREE.MeshStandardMaterial({ map: texturaAnel(), roughness: 0.5, metalness: 0.3 })
  );
  anel.rotation.x = -Math.PI / 2;                    // deitado na tampa, olhando pra cima
  anel.position.set(x, RODA_Y, RODA_Z);
  anel.receiveShadow = true;
  maquina.add(anel);

  const grupoPinos = new THREE.Group();              // parte que gira
  grupoPinos.position.set(x, RODA_Y, RODA_Z);
  const miolo = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 32), bronzeFosco);
  miolo.position.y = 0.03;
  miolo.castShadow = true;
  grupoPinos.add(miolo);
  for (let p = 0; p < 10; p++) {
    const a = p * Math.PI * 2 / 10;
    const pino = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.22, 12), materiais.latao);
    pino.position.set(Math.cos(a) * 0.46, 0.14, Math.sin(a) * 0.46);
    pino.castShadow = true;
    grupoPinos.add(pino);
  }
  maquina.add(grupoPinos);
  rodas.push(grupoPinos);

  // alvos de clique invisiveis sobre cada numero fixo do anel
  for (let d = 0; d < 10; d++) {
    const a = -Math.PI / 2 + d * Math.PI * 2 / 10;
    const alvo = new THREE.Mesh(
      new THREE.SphereGeometry(0.19, 8, 8),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
    );
    // no canvas: +x direita, +y desce; no mundo (anel deitado): +x direita, +y do canvas = +z do mundo
    alvo.position.set(x + Math.cos(a) * (200 / ANEL_R) * RAIO_ANEL_MUNDO, RODA_Y + 0.06, RODA_Z + Math.sin(a) * (200 / ANEL_R) * RAIO_ANEL_MUNDO);
    alvo.userData = { col, digito: d };
    maquina.add(alvo);
    clicaveis.push(alvo);
  }
});

// ---------- rotulos ----------
document.fonts.ready.then(() => {
  COL_X.forEach((x, col) => {
    const sp = criaRotulo(NOMES[col]);
    sp.position.set(x, 3.3, VISOR_Z);
    maquina.add(sp);
  });
  tambores.forEach((tb) => { tb.material.map = texturaTambor(); tb.material.needsUpdate = true; });
  redimensiona();
});

// ---------- mecanica: fila de passos de 1 dente, vai-um entra na frente ----------
const PASSO_ANG = Math.PI * 2 / 10;
const passosDados = [0, 0, 0];   // total de dentes girados por coluna (rodas e tambores acumulam)
let fila = [];                   // {col, carry}
let passo = null;                // passo em andamento
let desafio = 0;                 // 0=nao, 1=montando 28, 2=somando 35

function valor() { return estado[2] * 100 + estado[1] * 10 + estado[0]; }
function pintaHud() {
  elValor.textContent = String(valor()).padStart(3, '0');
}
pintaHud();

function soma(col, d, aviso = true) {
  if (!Number.isInteger(col) || col < 0 || col > 2) return;   // gancho de QA nao pode congelar a pagina
  if (!Number.isInteger(d) || d < 1 || d > 9) return;
  for (let i = 0; i < d; i++) fila.push({ col, carry: false });
  if (aviso) legenda.innerHTML = '<b>+' + d + '</b> na ' + NOMES[col].toLowerCase() + ': a roda gira ' + d + ' dente' + (d === 1 ? '' : 's') + '.';
}

function completaPasso(col) {
  estado[col] = (estado[col] + 1) % 10;
  passosDados[col]++;
  if (estado[col] === 0) {                       // rolou 9 -> 0: sautoir derruba o vai-um na proxima casa
    if (col < 2) {
      fila.unshift({ col: col + 1, carry: true });
      if (alavancas[col]) alavancas[col].t = 0;
      legenda.innerHTML = '<b>vai-um!</b> O 9 virou 0 na ' + NOMES[col].toLowerCase() + ' e o sautoir caiu na ' + NOMES[col + 1].toLowerCase() + '.';
    } else {
      legenda.innerHTML = 'Estourou a centena: 999 + 1 = <b>000</b>. A máquina real tinha mais rodas.';
    }
  }
  pintaHud();
  if (!fila.length) checaDesafio();
}

function venceu() {
  desafio = 0;
  elMeta.textContent = '🎉 63';
  elMeta.className = 'meta mono win';
  legenda.className = 'legenda ok';
  legenda.innerHTML = '28 + 35 = 63. Somou sem contar nos dedos: só girando. 🎉';
}
function checaDesafio() {
  if (!desafio) return;
  if (valor() > 63) {                          // passou do alvo em qualquer fase: avisa em vez de travar mudo
    legenda.className = 'legenda';
    legenda.innerHTML = 'Passou do alvo (' + valor() + ') — clique <b>desafio</b> pra recomeçar.';
    return;
  }
  if (valor() === 63) { venceu(); return; }    // fechou a conta inteira de uma vez (cliques enfileirados)
  if (desafio === 1 && valor() === 28) {
    desafio = 2;
    elMeta.textContent = 'agora some 35';
    legenda.innerHTML = '<b>28</b> no visor. Agora some <b>35</b>: 3 na dezena, 5 na unidade — e repare no vai-um do 8+5.';
  }
}

function zerar(msg) {
  fila = []; passo = null; desafio = 0;
  estado.fill(0); passosDados.fill(0);
  rodas.forEach((r) => r.rotation.y = 0);
  tambores.forEach((t) => t.rotation.x = 0);
  alavancas.forEach((a) => { a.t = -1; a.grupo.rotation.z = 0; });   // sautoir nao fica caindo pos-reset
  elMeta.textContent = ''; elMeta.className = 'meta mono';
  legenda.className = 'legenda';
  pintaHud();
  if (msg) legenda.innerHTML = msg;
}

document.getElementById('btnZerar').addEventListener('click', () => zerar('Zerado. Clique nos números pra somar.'));
document.getElementById('btn91').addEventListener('click', () => {
  controls.autoRotate = false;
  zerar();
  legenda.innerHTML = 'Montando o <b>9</b> na unidade...';
  soma(0, 9, false);
  fila.push({ espera: 0.9 });
  fila.push({ col: 0, carry: false, antes: 'Agora o <b>+1</b>... o fio está cheio, e a máquina resolve sozinha:' });
});
document.getElementById('btn991').addEventListener('click', () => {
  controls.autoRotate = false;
  zerar();
  legenda.innerHTML = 'Montando o <b>99</b>...';
  soma(1, 9, false);
  soma(0, 9, false);
  fila.push({ espera: 0.9 });
  fila.push({ col: 0, carry: false, antes: 'Agora o <b>+1</b>: repare na cascata — unidade estoura a dezena, dezena estoura a centena:' });
});
document.getElementById('btnDesafio').addEventListener('click', () => {
  controls.autoRotate = false;
  zerar();
  desafio = 1;
  elMeta.textContent = 'meta: 28';
  legenda.innerHTML = 'Sua vez: monte <b>28</b> — clique no 2 da dezena e no 8 da unidade.';
});

// gancho de teste (usado pelo QA via Playwright); tela() projeta o alvo de clique de um digito pra pixels
window.__pascalina = {
  soma, valor, estado,
  filaVazia: () => !fila.length && !passo,
  desafioAtivo: () => desafio,
  tela: (col, digito) => {
    const alvo = clicaveis.find((c) => c.userData.col === col && c.userData.digito === digito);
    if (!alvo) return null;
    const p = alvo.position.clone().project(camera);
    const r = renderer.domElement.getBoundingClientRect();
    return { x: r.left + (p.x + 1) / 2 * r.width, y: r.top + (1 - p.y) / 2 * r.height };
  },
};

// ---------- clique nos numeros ----------
aoClicar(clicaveis, (hit) => {
  const { col, digito } = hit.object.userData;
  if (digito === 0) { legenda.innerHTML = 'Somar <b>0</b> é não girar — clique de 1 a 9.'; return; }
  soma(col, digito);
});

// ---------- animacao ----------
inicia((dt) => {
  // sautoir caindo (rapidinho) quando dispara
  alavancas.forEach((a) => {
    if (a.t < 0) return;
    a.t += dt;
    const p = a.t / 0.45;
    if (p >= 1) { a.grupo.rotation.z = 0; a.t = -1; return; }
    a.grupo.rotation.z = -Math.sin(Math.min(p * 2, 1) * Math.PI) * 0.55;   // desce e volta
  });

  // um passo de cada vez: roda e tambor giram 1 dente juntos
  if (!passo && fila.length) {
    passo = fila.shift();
    passo.t = 0;
    passo.dur = passo.espera ? passo.espera : (passo.carry ? 0.22 : 0.18);
    if (passo.antes) legenda.innerHTML = passo.antes;
  }
  if (passo) {
    passo.t += dt;
    const p = Math.min(passo.t / passo.dur, 1);
    if (passo.col !== undefined) {
      const suave = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const ang = (passosDados[passo.col] + suave) * PASSO_ANG;
      rodas[passo.col].rotation.y = -ang;
      tambores[passo.col].rotation.x = ang;   // +ang traz o proximo digito da textura pra janela
    }
    if (p >= 1) {
      const fim = passo;
      passo = null;
      if (fim.col !== undefined) completaPasso(fim.col);
    }
  }
});
</script>
</body>
</html>
